<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indology Lineages</title>
<meta name="description" content="An academic genealogy of Indology: who studied under whom, who taught where and when, from the 17th century to today — Indology, Buddhist studies, Tibetology and their Japanese traditions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Indology <em>Lineages</em></h1>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-lineages" data-view="lineages" aria-selected="true">Lineages</button>
      <button role="tab" id="tab-chairs" data-view="chairs" aria-selected="false">Chairs</button>
      <button role="tab" id="tab-map" data-view="map" aria-selected="false">Map</button>
      <button role="tab" id="tab-fields" data-view="fields" aria-selected="false">Fields</button>
    </nav>
    <select id="lens" aria-label="Field of study"></select>
    <div class="search"><input id="search" placeholder="Find a scholar or a place…" autocomplete="off" aria-label="Find a scholar or a place"><ul id="suggest" class="suggest" hidden></ul></div>
    <select id="source" aria-label="Sources">
      <option value="all">All sources</option>
      <option value="books">Publications only</option>
      <option value="classic">Windisch &amp; Winternitz only</option>
      <option value="wd">Wikidata only</option>
    </select>
  </header>

  <main class="stage" id="stage">
    <div class="tools" id="tools"></div>
    <div class="view" id="view-lineages">
      <canvas id="graph" role="img" aria-label="Scholars placed by year of birth, coloured by field, linked by teacher–student and other relations"></canvas>
      <div class="legend" id="legend"></div>
      <div class="zoomers"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit all" title="Fit all">⤢</button></div>
    </div>
    <div class="view" id="view-chairs" hidden><div class="chairs-scroll" id="chairs-scroll"><svg id="chairs"></svg></div></div>
    <div class="view" id="view-fields" hidden><div class="fields-scroll" id="fields"></div></div>
    <div class="view" id="view-map" hidden>
      <svg id="map" role="img" aria-label="Map of the places where Indologists held posts"></svg>
      <div class="zoomers"><button id="min" aria-label="Zoom in">+</button><button id="mout" aria-label="Zoom out">−</button><button id="mfit" aria-label="Reset map" title="Reset">⤢</button></div>
    </div>
    <div class="yearbar" id="yearbar">
      <button id="play" aria-label="Play through the years">▶</button>
      <label class="allyears"><input type="checkbox" id="allyears" checked> all years</label>
      <input type="range" id="year" min="1780" max="2025" step="1" value="1900" aria-label="Year">
      <output id="yearout" for="year">1900</output>
      <span class="yearnote" id="yearnote"></span>
    </div>
    <div id="tip" hidden></div>
  </main>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
